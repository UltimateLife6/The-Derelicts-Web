<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="THE DERELICTS">
  <defs>
    <filter id="rough" x="-2%" y="-10%" width="104%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- crown accent -->
  <g fill="#f5e642" transform="translate(42 2)">
    <path d="M18 22 L26 6 L34 18 L42 4 L50 18 L58 6 L66 22 Z"/>
    <rect x="20" y="20" width="44" height="6" rx="1"/>
  </g>
  <text
    x="36"
    y="48"
    fill="#f0e2c4"
    font-family="Impact, Haettenschweiler, Arial Black, sans-serif"
    font-size="22"
    letter-spacing="0.28em"
    filter="url(#rough)"
  >THE</text>
  <text
    x="28"
    y="98"
    fill="#f7f1e4"
    font-family="Impact, Haettenschweiler, Arial Black, sans-serif"
    font-size="52"
    letter-spacing="0.04em"
    filter="url(#rough)"
  >DERELICTS</text>
  <!-- slight paint flecks -->
  <circle cx="470" cy="74" r="2.2" fill="#f0e2c4" opacity="0.7"/>
  <circle cx="486" cy="88" r="1.6" fill="#f0e2c4" opacity="0.55"/>
  <path d="M12 104 Q 40 110 70 102" stroke="#f0e2c4" stroke-width="2" fill="none" opacity="0.35"/>
</svg>
